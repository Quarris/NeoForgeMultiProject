org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Off: generated mods' default processResources templating isn't
# config-cache-safe when built through this root (works fine standalone).
org.gradle.configuration-cache=false

# Shared versions for the combined run (see build.gradle). Copy into each
# mod's own gradle.properties too - not inherited automatically.
# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# https://projects.neoforged.net/neoforged/neoforge - must match neo_version
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.248
loader_version_range=[1,)

# Convention: mod_group_id = "<mod_group_id_base>.<mod_id>", artifact id =
# mod_id - required for the generic substitution rule in build.gradle.
mod_group_id_base=com.example
